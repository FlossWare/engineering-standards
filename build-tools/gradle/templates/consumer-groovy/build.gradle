plugins {
    id 'java'
    id 'org.flossware.standards' version '2.0'
}

group = 'org.flossware'
version = '1.0'

flosswareStandards {
    coverageMode = 'strict'
    javaVersion = 21
}

repositories {
    mavenCentral()
    maven {
        url 'https://packagecloud.io/flossware/releases/maven2/'
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
}
